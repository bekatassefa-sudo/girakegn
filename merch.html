<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merch · ግራ ቀኝ GERA KEGN</title>
  <meta name="description" content="Official GERA KEGN the Movie merch: T-shirts, hoodies and tote bags.">
  <meta name="theme-color" content="#0d0b09">
  <link rel="canonical" href="https://gerakegn.com/merch.html">
  <meta property="og:title" content="Merch · GERA KEGN">
  <meta property="og:image" content="https://gerakegn.com/assets/img/campaign/og-share.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%230d0b09'/><path d='M32 12v38M18 50h28M14 22h36' stroke='%23c49a4a' stroke-width='4' stroke-linecap='round'/><circle cx='32' cy='12' r='4' fill='%239e2a20'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="merch">
<main id="main">
  <section class="page-hero">
    <div class="drift" data-speed="0.2" aria-hidden="true">ሸቀጦች · ሸቀጦች</div>
    <div class="wrap">
      <p class="page-file" data-reveal="left"><span>FILE 09</span><span data-am="ሸቀጦች">MERCH</span></p>
      <h1 class="h1" data-reveal="words" data-am="ግራ ቀኝን <em>ይልበሱ።</em>">Wear <em>the court.</em></h1>
      <p class="lede" data-reveal="up" style="--i:3" data-am="ይፋዊ የግራ ቀኝ ሸቀጦች በቅርቡ ይቀርባሉ። ሲዘጋጁ ቀድመው ለማወቅ ይመዝገቡ።">Official GERA KEGN merch is coming soon. Sign up to hear first when it's ready.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div data-component="merch"></div>
    </div>
  </section>

  <section class="section-tight section-alt">
    <div class="wrap-narrow center">
      <p class="eyebrow" data-reveal="up" data-am="ቀድመው ይወቁ">Be the first to know</p>
      <h2 class="h2" data-reveal="words" data-am="ሲዘጋጁ እናሳውቅዎታለን">We'll tell you when it's ready</h2>
      <form class="mini-form" data-form="merch-notify" name="merch-notify" data-netlify="true" netlify-honeypot="bot-field" data-reveal="up" novalidate style="margin:24px auto 0">
        <input type="hidden" name="form-name" value="merch-notify"><p hidden><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <label class="sr" for="mnEmail" data-am="ኢሜይል">Email</label>
        <input id="mnEmail" type="email" name="email" required autocomplete="email" placeholder="your@email.com">
        <button class="btn btn-gold btn-sm" type="submit" data-am="አሳውቁኝ">Notify me</button>
        <p class="form-msg" role="status"></p>
      </form>
    </div>
  </section>
</main>
<script src="assets/js/content.js"></script>
</body>
</html>
