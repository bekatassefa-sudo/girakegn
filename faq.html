<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ · ግራ ቀኝ GERA KEGN</title>
  <meta name="description" content="Answers about GERA KEGN the Movie, the series, crowdfunding, ጓድ Producers, partnerships, the diaspora, payments, transparency and release.">
  <meta name="theme-color" content="#0d0b09">
  <link rel="canonical" href="https://gerakegn.com/faq.html">
  <meta property="og:title" content="FAQ · GERA KEGN">
  <meta property="og:image" content="https://gerakegn.com/assets/img/campaign/og-share.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%230d0b09'/><path d='M32 12v38M18 50h28M14 22h36' stroke='%23c49a4a' stroke-width='4' stroke-linecap='round'/><circle cx='32' cy='12' r='4' fill='%239e2a20'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="faq">
<main id="main">
  <section class="page-hero">
    <div class="drift" data-speed="0.2" aria-hidden="true">ጥያቄዎች · ጥያቄዎች</div>
    <div class="wrap">
      <p class="page-file" data-reveal="left"><span>FILE 12</span><span data-am="ጥያቄዎች">FAQ</span></p>
      <h1 class="h1" data-reveal="words" data-am="ጥያቄዎች <em>ለችሎቱ</em>">Questions <em>for the court</em></h1>
      <p class="lede" data-reveal="up" style="--i:3" data-am="ስለ ፊልሙ፣ ስለ ተከታታዩ፣ ስለ ፕሮዲዩሰርነት፣ ስለ ክፍያዎች እና ሌሎችም።">About the film, the series, becoming a producer, payments and more.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap-narrow">
      <div data-component="faq" data-reveal="up"></div>
    </div>
  </section>

  <section class="section section-alt" id="contact">
    <div class="wrap split top">
      <div>
        <p class="eyebrow" data-reveal="left" data-am="ያግኙን">Contact</p>
        <h2 class="h2" data-reveal="words" data-am="ሌላ ጥያቄ አለዎት?">Still have a question?</h2>
        <p class="lede" data-reveal="up" data-am="ይጻፉልን፤ በአማርኛም በእንግሊዝኛም እንመልሳለን።">Write to us — we answer in Amharic and English.</p>
        <p class="muted" data-reveal="up">hello@gerakegn.com · press@gerakegn.com</p>
      </div>
      <form class="paper" data-form="contact" name="contact" data-netlify="true" netlify-honeypot="bot-field" data-reveal="right" novalidate
            data-ok="Message received. We'll reply soon." data-ok-am="መልእክትዎ ደርሷል። በቅርቡ እንመልሳለን።">
        <input type="hidden" name="form-name" value="contact"><p hidden><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <div class="paper-stamp" data-am="ደብዳቤ">LETTER</div>
        <p class="paper-head typed" data-am="ለችሎቱ ጸሐፊ · ቅጽ 06">TO THE COURT CLERK · FORM 06</p>
        <div class="form-grid">
          <div class="field"><label for="m-name" data-am="ስም *">Name *</label><input id="m-name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="m-email" data-am="ኢሜይል *">Email *</label><input id="m-email" name="email" type="email" required autocomplete="email"></div>
          <div class="field full"><label for="m-topic" data-am="ርዕስ">Topic</label>
            <select id="m-topic" name="topic"><option>General</option><option>Crowdfunding / payments</option><option>ጓድ Producer</option><option>Partnerships</option><option>Diaspora</option><option>Press</option></select></div>
          <div class="field full"><label for="m-msg" data-am="መልእክት *">Message *</label><textarea id="m-msg" name="message" required></textarea></div>
          <div class="form-foot"><button class="btn btn-ink" type="submit" data-am="ይላኩ">Send</button></div>
        </div>
        <p class="form-msg" role="status"></p>
      </form>
    </div>
  </section>
</main>
<script src="assets/js/content.js"></script>
</body>
</html>
