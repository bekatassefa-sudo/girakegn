# =====================================================================
# GERA KEGN — Content admin (Decap CMS)
# Editors sign in at https://<domain>/admin
#
# Moderation workflow (publish_mode: editorial_workflow):
#   Draft  →  In review  →  Ready  →  Published
#   Editors create and edit drafts. Nothing reaches the public site until
#   the designated Content Approver moves it to "Ready" and publishes.
# =====================================================================

backend:
  name: git-gateway        # Netlify Identity (invite-only accounts) + Git Gateway
  branch: main
  commit_messages:
    create: "Create {{collection}} “{{slug}}” — by {{author-name}}"
    update: "Update {{collection}} “{{slug}}” — by {{author-name}}"
    delete: "Delete {{collection}} “{{slug}}” — by {{author-name}}"

publish_mode: editorial_workflow

# Lets you run the admin locally:  npx decap-server  (then open /admin)
local_backend: true

site_url: https://gerakegn.com
display_url: https://gerakegn.com
logo_url: /admin/logo.svg
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  # ------------------------------------------------------------------
  - name: series
    label: "The Series (episodes)"
    description: "Episodes stream from YouTube. Paste the YouTube link for each episode. Untick “Published” to hide an episode without deleting it."
    editor: { preview: false }
    files:
      - name: series
        label: "Seasons & episodes"
        file: content/series.json
        fields:
          - name: series
            label: "Series"
            widget: object
            collapsed: false
            fields:
              - { name: playlist, label: "YouTube playlist link (optional)", widget: string, required: false }
              - name: seasons
                label: "Seasons"
                widget: list
                summary: "Season {{fields.season}}"
                fields:
                  - { name: season, label: "Season number", widget: number, value_type: int, min: 1 }
                  - name: year
                    label: "Season label"
                    widget: object
                    fields: &bi
                      - { name: en, label: "English", widget: string }
                      - { name: am, label: "አማርኛ (Amharic)", widget: string, required: false }
                  - name: blurb
                    label: "Season summary"
                    widget: object
                    fields: &bitext
                      - { name: en, label: "English", widget: text }
                      - { name: am, label: "አማርኛ (Amharic)", widget: text, required: false }
                  - name: episodes
                    label: "Episodes"
                    widget: list
                    summary: "E{{fields.ep}} · {{fields.title.en}}"
                    fields:
                      - { name: ep, label: "Episode number", widget: number, value_type: int, min: 1 }
                      - { name: youtube, label: "YouTube link", widget: string, required: false, hint: "e.g. https://www.youtube.com/watch?v=XXXXXXXXXXX or https://youtu.be/XXXXXXXXXXX. Embedding must be allowed in YouTube Studio." }
                      - { name: duration, label: "Duration (mm:ss)", widget: string, pattern: ['^\d{1,3}:\d{2}$', "Use mm:ss, e.g. 47:10"] }
                      - { name: published, label: "Published (visible on site)", widget: boolean, default: true }
                      - { name: featured, label: "Featured (shown on Home & Series)", widget: boolean, default: false }
                      - { name: title, label: "Title", widget: object, fields: *bi }
                      - { name: desc, label: "Description", widget: object, fields: *bitext }

  # ------------------------------------------------------------------
  - name: news
    label: "Production Diary"
    description: "News, behind-the-scenes, milestones, photos, videos and campaign updates."
    editor: { preview: false }
    files:
      - name: news
        label: "Diary posts"
        file: content/news.json
        fields:
          - name: news
            label: "Posts"
            widget: list
            summary: "{{fields.date}} · {{fields.title.en}}"
            add_to_top: true
            fields:
              - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - name: category
                label: "Category"
                widget: select
                options:
                  - { label: "News", value: news }
                  - { label: "Behind the scenes", value: bts }
                  - { label: "Milestone", value: milestone }
                  - { label: "Announcement", value: announcement }
                  - { label: "Photos", value: photos }
                  - { label: "Video", value: video }
                  - { label: "Campaign update", value: campaign }
              - { name: published, label: "Published", widget: boolean, default: true }
              - { name: title, label: "Headline", widget: object, fields: *bi }
              - { name: text, label: "Summary", widget: object, fields: *bitext }
              - { name: youtube, label: "YouTube link (for video posts)", widget: string, required: false }

  # ------------------------------------------------------------------
  - name: campaign
    label: "Crowdfunding, Transparency & Partners"
    editor: { preview: false }
    files:
      - name: campaign
        label: "Campaign settings"
        file: content/campaign.json
        fields:
          - name: crowdfunding
            label: "Crowdfunding"
            widget: object
            collapsed: false
            fields:
              - { name: currency, label: "Currency", widget: string, default: "ETB" }
              - { name: usdRate, label: "ETB → USD display rate", widget: number, value_type: float, step: 0.0001 }
              - { name: goal, label: "Funding goal (ETB)", widget: number, value_type: int }
              - { name: raised, label: "Raised so far (ETB)", widget: number, value_type: int, hint: "Update from the payment provider reports until live totals are connected." }
              - { name: backers, label: "Number of backers", widget: number, value_type: int }
              - { name: guadProducers, label: "Number of ጓድ Producers", widget: number, value_type: int }
              - { name: endsOn, label: "Campaign end", widget: datetime }
              - name: channels
                label: "Payment channels"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: id, label: "ID", widget: string }
                  - { name: name, label: "Name", widget: string }
                  - { name: note, label: "Note", widget: object, fields: *bi }
                  - { name: url, label: "Payment link", widget: string, hint: "Use # until the gateway is live." }
              - name: tiers
                label: "Contribution levels"
                widget: list
                summary: "{{fields.title.en}} · {{fields.amount}} ETB"
                fields:
                  - { name: amount, label: "Amount (ETB)", widget: number, value_type: int }
                  - { name: usd, label: "Approx. USD", widget: number, value_type: int }
                  - { name: title, label: "Level name", widget: object, fields: *bi }
                  - { name: featured, label: "Highlight this level", widget: boolean, default: false, required: false }
                  - { name: guad, label: "Qualifies as ጓድ Producer", widget: boolean, default: false, required: false }
                  - name: perks
                    label: "Rewards"
                    widget: object
                    fields:
                      - { name: en, label: "English", widget: list, field: { name: perk, label: "Reward", widget: string } }
                      - { name: am, label: "አማርኛ", widget: list, required: false, field: { name: perk, label: "ሽልማት", widget: string } }
              - name: useOfFunds
                label: "Use of funds (Transparency page)"
                widget: list
                summary: "{{fields.pct}}% · {{fields.label.en}}"
                hint: "Percentages should add up to 100."
                fields:
                  - { name: pct, label: "Percent", widget: number, value_type: int, min: 0, max: 100 }
                  - { name: label, label: "Label", widget: object, fields: *bi }
          - name: partnerPackages
            label: "Corporate partner packages"
            widget: list
            summary: "{{fields.title.en}}"
            fields:
              - { name: title, label: "Package name", widget: object, fields: *bi }
              - { name: slots, label: "Slots available (blank = on request)", widget: number, value_type: int, required: false }
              - name: perks
                label: "Benefits"
                widget: object
                fields:
                  - { name: en, label: "English", widget: list, field: { name: perk, label: "Benefit", widget: string } }
                  - { name: am, label: "አማርኛ", widget: list, required: false, field: { name: perk, label: "ጥቅም", widget: string } }

  # ------------------------------------------------------------------
  - name: credits
    label: "ጓድ Producer credits"
    description: "MODERATED. Only add names that have (1) a verified qualifying payment and (2) passed the credit guidelines. Submissions arrive privately in Netlify → Forms → guad-name."
    editor: { preview: false }
    files:
      - name: credits
        label: "Approved credit names"
        file: content/credits.json
        fields:
          - name: guadNames
            label: "Approved names (shown alphabetically on the site)"
            widget: list
            summary: "{{fields.name}}"
            add_to_top: true
            fields:
              - { name: name, label: "Name as it appears in the credits", widget: string, pattern: ['^.{1,40}$', "Max 40 characters"] }

  # ------------------------------------------------------------------
  - name: film
    label: "The Film (cast, crew, cases, milestones)"
    editor: { preview: false }
    files:
      - name: film
        label: "Film information"
        file: content/film.json
        fields:
          - name: cast
            label: "Cast"
            widget: list
            summary: "{{fields.actor}} — {{fields.role.en}}"
            fields:
              - { name: actor, label: "Actor", widget: string }
              - { name: photo, label: "Photo", widget: image, required: false }
              - { name: role, label: "Character", widget: object, fields: *bi }
              - { name: bio, label: "Character line", widget: object, fields: *bitext }
          - name: crew
            label: "Creative team"
            widget: list
            summary: "{{fields.role.en}}: {{fields.name}}"
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: role, label: "Role", widget: object, fields: *bi }
          - name: cases
            label: "Case files"
            widget: list
            summary: "{{fields.no}} · {{fields.title.en}}"
            fields:
              - { name: no, label: "File number", widget: string }
              - { name: season, label: "Season (1, 2 or “film” for the sealed file)", widget: string }
              - { name: title, label: "Title", widget: object, fields: *bi }
              - { name: text, label: "Summary", widget: object, fields: *bitext }
          - name: milestones
            label: "Production milestones (Transparency, Movie)"
            widget: list
            summary: "[{{fields.status}}] {{fields.title.en}}"
            fields:
              - name: status
                label: "Status"
                widget: select
                options: [ { label: "Done", value: done }, { label: "Now", value: now }, { label: "Next", value: next } ]
              - { name: when, label: "When", widget: object, fields: *bi }
              - { name: title, label: "Title", widget: object, fields: *bi }
              - { name: text, label: "Text", widget: object, fields: *bi }
          - name: gallery
            label: "Gallery"
            widget: list
            summary: "{{fields.label.en}}"
            fields:
              - { name: label, label: "Caption", widget: object, fields: *bi }
              - name: tone
                label: "Placeholder tone"
                widget: select
                options: [a, b, c, d, e, f]

  # ------------------------------------------------------------------
  - name: faq
    label: "FAQ"
    editor: { preview: false }
    files:
      - name: faq
        label: "Questions & answers"
        file: content/faq.json
        fields:
          - name: faq
            label: "Topics"
            widget: list
            summary: "{{fields.title.en}}"
            fields:
              - { name: id, label: "Topic ID (no spaces)", widget: string }
              - { name: title, label: "Topic", widget: object, fields: *bi }
              - name: items
                label: "Questions"
                widget: list
                summary: "{{fields.q.en}}"
                fields:
                  - { name: q, label: "Question", widget: object, fields: *bi }
                  - { name: a, label: "Answer", widget: object, fields: *bitext }

  # ------------------------------------------------------------------
  - name: site
    label: "Site settings & cinemas"
    editor: { preview: false }
    files:
      - name: site
        label: "Settings"
        file: content/site.json
        fields:
          - name: site
            label: "Site"
            widget: object
            collapsed: false
            fields:
              - { name: releaseDate, label: "Release date (countdown target)", widget: datetime }
              - { name: releaseLabel, label: "Release label", widget: object, fields: *bi }
              - { name: trailerUrl, label: "Teaser YouTube link", widget: string, required: false }
              - { name: youtubeChannel, label: "YouTube channel link", widget: string }
              - name: social
                label: "Social links"
                widget: object
                fields:
                  - { name: youtube, label: "YouTube", widget: string }
                  - { name: facebook, label: "Facebook", widget: string }
                  - { name: instagram, label: "Instagram", widget: string }
                  - { name: tiktok, label: "TikTok", widget: string }
                  - { name: telegram, label: "Telegram", widget: string }
                  - { name: x, label: "X", widget: string }
              - name: email
                label: "Contact emails"
                widget: object
                fields:
                  - { name: hello, label: "General", widget: string }
                  - { name: press, label: "Press", widget: string }
                  - { name: partners, label: "Partners", widget: string }
          - name: cinemas
            label: "Release cities"
            widget: list
            summary: "{{fields.city.en}} ({{fields.region}}) · {{fields.status}}"
            fields:
              - { name: city, label: "City", widget: object, fields: *bi }
              - { name: region, label: "Country code", widget: string }
              - name: status
                label: "Status"
                widget: select
                options: [ { label: "Planned", value: planned }, { label: "Confirmed", value: confirmed }, { label: "Open for votes", value: vote } ]
